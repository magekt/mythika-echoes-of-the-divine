<script>
  // Classic script tags below execute before the Firebase module resolves.
  // Keep the opt-in probe available during that gap as well as afterwards.
  window.__mythikaProbeGroup = window.__mythikaProbeGroup || function(name, phase) {
    if (!/[?&]probe(?:&|$)/.test(location.search)) return;
    window.__mythikaProbeGroups = window.__mythikaProbeGroups || {};
    if (phase === 'start') window.__mythikaProbeGroups[name] = performance.now();
    else if (window.__mythikaProbeGroups[name] != null) {
      console.log('[Mythika] script-group ' + name + '=' + (performance.now() - window.__mythikaProbeGroups[name]).toFixed(1) + 'ms');
      delete window.__mythikaProbeGroups[name];
    }
  };
  // Script tags are deliberately synchronous for the global Canvas runtime.
  // Group timings therefore include network/cache waits as well as evaluation.
  // Keep a second, opt-in resource report so probe readings do not get
  // mistaken for JavaScript execution time.
  window.__mythikaProbeScriptResources = function() {
    if (!/[?&]probe(?:&|$)/.test(location.search) || !window.performance || !performance.getEntriesByType) return;
    var entries = performance.getEntriesByType('resource').filter(function(entry) {
      return entry.initiatorType === 'script' && /\/src\//.test(entry.name);
    });
    var total = entries.reduce(function(sum, entry) { return sum + entry.duration; }, 0);
    console.log('[Mythika] script-resources=' + JSON.stringify({
      count: entries.length,
      networkMs: Number(total.toFixed(1)),
      resources: entries.map(function(entry) {
        return { name: entry.name.split('/src/')[1] || entry.name, ms: Number(entry.duration.toFixed(1)), transfer: entry.transferSize || 0 };
      })
    }));
  };
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, RecaptchaVerifier, signInWithPhoneNumber, signOut as firebaseSignOut, PhoneAuthProvider, signInWithCredential } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Make Firebase functions available globally for auth.js
  window.firebaseAuth = null;
  window.firebaseDb = null;
  window.firebaseSignOut = firebaseSignOut;
  window.signOut = firebaseSignOut;
  window.firebaseSignUpEmail = createUserWithEmailAndPassword;
  window.firebaseSignInEmail = signInWithEmailAndPassword;
  window.firebaseSignInPopup = signInWithPopup;
  window.firebaseGoogleProvider = new GoogleAuthProvider();
  window.firebaseRecaptchaVerifier = RecaptchaVerifier;
  window.firebaseSignInPhone = signInWithPhoneNumber;
  window.signInWithPhoneNumber = signInWithPhoneNumber;
  window.signInWithCredential = signInWithCredential;
  window.PhoneAuthProvider = PhoneAuthProvider;
  window.firebaseOnAuthStateChanged = onAuthStateChanged;
  window.firebaseDoc = doc;
  window.firebaseSetDoc = setDoc;
  window.firebaseGetDoc = getDoc;
  window.firebaseServerTimestamp = serverTimestamp;
  // auth.js is a classic script and intentionally consumes these names as
  // globals. Keep the single modular SDK bridge compatible with that API.
  window.onAuthStateChanged = onAuthStateChanged;
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;
  window.signInWithPopup = signInWithPopup;
  window.GoogleAuthProvider = GoogleAuthProvider;
  window.RecaptchaVerifier = RecaptchaVerifier;
  window.doc = doc;
  window.setDoc = setDoc;
  window.getDoc = getDoc;
  window.serverTimestamp = serverTimestamp;

  try {
    const app = initializeApp(window.FIREBASE_CONFIG);
    window.firebaseApp = app;
    window.firebaseAuth = getAuth(app);
    window.firebaseDb = getFirestore(app);
    console.log('[Mythika] Firebase initialized');
    // Signal Firebase is ready
    window.firebaseReady = true;
    document.dispatchEvent(new Event('firebase-ready'));
  } catch (e) {
    console.warn('[Mythika] Firebase init failed:', e.message);
    window.firebaseReady = false;
  }
</script>
